name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - release-candidate
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - release-candidate

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest

    env: # ← Define reusable environment variables here
      API_URL: ${{ secrets.API_URL }}
      APPS_MARKETPLACE_API_URL: ${{ secrets.APPS_MARKETPLACE_API_URL }}
      EXTENSIONS_API_URL: ${{ secrets.EXTENSIONS_API_URL }}
      DEMO_MODE: ${{ secrets.DEMO_MODE }}
      LOCALE_CODE: ${{ secrets.LOCALE_CODE }}

    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Inject environment variables into .env
        run: |
          echo "API_URL=$API_URL" > .env
          echo "APPS_MARKETPLACE_API_URL=$APPS_MARKETPLACE_API_URL" >> .env
          echo "EXTENSIONS_API_URL=$EXTENSIONS_API_URL" >> .env
          echo "DEMO_MODE=$DEMO_MODE" >> .env
          echo "LOCALE_CODE=$LOCALE_CODE" >> .env

      - name: Print API_URL
        run: echo "API_URL $API_URL"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_TREE_0A8A1D200 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build/dashboard" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_TREE_0A8A1D200 }}
          action: "close"
